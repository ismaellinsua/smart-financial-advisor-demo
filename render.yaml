# Render Blueprint: the app in Frankfurt (EU), next to a Neon database in eu-central-1.
# Render → New → Blueprint → this repository. Values marked sync: false are asked for once, in Render, never stored here.
services:
  - type: web
    name: nirkana
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /_stcore/health
    autoDeploy: false
    # One instance: sign-in throttling and short caches live in the app's memory (audit A7).
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Several businesses in one app, and charging them with Stripe (see the README).
      - key: MULTI_TENANT
        sync: false
      - key: OPERATOR_PASSWORD
        sync: false
      - key: OPERATOR_TOTP_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        sync: false
