# Render Blueprint: the app in Frankfurt (EU), next to a Neon database in eu-central-1.
# Render → New → Blueprint → this repository. Values marked sync: false are asked for once, in Render, never stored here.
services:
  - type: web
    name: nirkana
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /_stcore/health
    autoDeploy: false
    # Sessions, tickets in progress, sign-in limits and Stripe notices live in the database, so more instances
    # can be added when one is not enough (README, «Escalar»); each one keeps only caches of 2-90 seconds.
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Several businesses in one app, and charging them with Stripe (see the README).
      - key: MULTI_TENANT
        sync: false
      - key: DATA_KEY
        sync: false
      - key: OPERATOR_PASSWORD
        sync: false
      - key: OPERATOR_TOTP_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        sync: false
      # Where the legal texts are published (each business accepts them) and where error alerts go.
      - key: TERMS_URL
        sync: false
      - key: OPERATOR_EMAIL
        sync: false
