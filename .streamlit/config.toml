[theme]
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#1B2430"
font = "sans serif"

[client]
toolbarMode = "minimal"
# Visitors see a short error message, never internal tracebacks.
showErrorDetails = "type"

[browser]
gatherUsageStats = false

[server]
# Backups are small; refuse large uploads.
maxUploadSize = 20
enableXsrfProtection = true
enableCORS = true
