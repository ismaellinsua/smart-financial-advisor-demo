name: Web boundaries
on:
  pull_request:
    paths:
      - "docs/**"
      - "tests/web-boundaries.test.mjs"
      - ".github/workflows/web-boundaries.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/web-boundaries.test.mjs"
      - ".github/workflows/web-boundaries.yml"
permissions:
  contents: read
jobs:
  web-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/web-boundaries.test.mjs
