name: Web boundaries
on:
  pull_request:
    paths:
      - "docs/**"
      - "tests/web-*.test.mjs"
      - ".github/workflows/web-boundaries.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/web-*.test.mjs"
      - ".github/workflows/web-boundaries.yml"
permissions:
  contents: read
jobs:
  web-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - run: node --test tests/web-boundaries.test.mjs tests/web-claims.test.mjs tests/web-rediseno.test.mjs tests/web-guias.test.mjs tests/web-herramientas.test.mjs tests/web-publico.test.mjs tests/web-video.test.mjs
