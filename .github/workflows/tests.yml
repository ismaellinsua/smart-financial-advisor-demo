# Runs the whole test suite on every push and pull request, against SQLite and a real PostgreSQL, with the server
# clock in UTC like the cloud. A red check means the change must not be merged.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
      TEST_DATABASE_URL: postgresql://postgres:tests@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: pip install --quiet -r requirements.txt pytest pyflakes

      - name: Cliente de PostgreSQL 16 (para el test de copias)
        run: command -v pg_dump || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16; }

      - name: Revisión estática
        run: python -m pyflakes sales_manager ops

      - name: Tests (SQLite y PostgreSQL)
        working-directory: sales_manager
        run: python -m pytest -q -p no:cacheprovider
