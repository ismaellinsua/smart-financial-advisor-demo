# Runs the whole test suite on every push and pull request, against SQLite and a real PostgreSQL, with the server
# clock in UTC like the cloud, plus a real-browser sale at phone size. A red check means the change must not be merged.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    # One job, one runner: a second parallel job waited for a free runner until it timed out.
    timeout-minutes: 30
    env:
      TZ: UTC
      TEST_DATABASE_URL: postgresql://postgres:tests@localhost:5432/postgres
      STRIPE_MOCK_URL: http://localhost:12111/v1
    services:
      # Stripe's official simulator: every Stripe call the app makes is checked against Stripe's API description.
      stripe:
        image: stripe/stripe-mock:v0.206.0
        ports:
          - 12111:12111
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the whole history, for the secrets check

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Dependencias
        run: pip install --quiet --require-hashes -r requirements.lock && pip install --quiet -r requirements-dev.txt

      - name: Navegador para la prueba en móvil
        run: python -m playwright install --with-deps chromium

      - name: Cliente de PostgreSQL 16 (para el test de copias)
        run: command -v pg_dump || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16; }

      - name: Revisión estática
        run: |
          python -m pyflakes sales_manager ops
          ruff check sales_manager ops

      # Every pinned package checked against the public vulnerability databases (PyPI/OSV).
      - name: Dependencias sin vulnerabilidades conocidas
        run: |
          pip install --quiet pip-audit==2.9.0
          pip-audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off

      # The whole history, not only this change: a secret removed later is still in Git. Reviewed findings that are not
      # secrets go in .gitleaksignore; a real one must be rotated.
      - name: Secretos en el historial
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .

      - name: Tests (SQLite y PostgreSQL)
        working-directory: sales_manager
        # Fails if coverage of core/, ui/ and the scheduled scripts in ops/ (followed into their own processes, see
        # .coveragerc) drops below 85 %.
        run: python -m pytest -q -p no:cacheprovider --cov=core --cov=ui --cov=../ops --cov-report=term --cov-fail-under=85

      # The image that goes to production: it must build, answer its health check and send the security headers.
      - name: Construir la imagen del contenedor
        run: docker build -t nirkana:ci .

      - name: Arrancar el contenedor y comprobarlo
        run: |
          docker run -d --name app -p 8080:8080 -e APP_PASSWORD=ci-solo-prueba nirkana:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8080/_stcore/health && break; sleep 1; done
          curl -sf http://localhost:8080/_stcore/health
          # The external monitor's check: app and database (no database here, so the app alone).
          test "$(curl -s http://localhost:8080/_nk/salud)" = "ok" || { echo "::error::/_nk/salud no responde ok"; exit 1; }
          headers=$(curl -sI http://localhost:8080/)
          echo "$headers"
          for h in "Strict-Transport-Security" "X-Frame-Options: SAMEORIGIN" "X-Content-Type-Options: nosniff" \
                   "Content-Security-Policy: default-src 'self'" "Referrer-Policy" "Permissions-Policy"; do
            echo "$headers" | grep -qi "^$h" || { echo "::error::Falta la cabecera $h"; exit 1; }
          done
          echo "$headers" | grep -i "^Content-Security-Policy" | grep -q "frame-ancestors 'self'" \
            && echo "$headers" | grep -i "^Content-Security-Policy" | grep -q "connect-src 'self'" \
            || { echo "::error::La CSP no limita marcos o conexiones"; exit 1; }
          ! echo "$headers" | grep -i "^Content-Security-Policy" | grep -oi "script-src[^;]*" | grep -q "unsafe-inline" \
            || { echo "::error::La CSP permite cualquier script en línea"; exit 1; }
          ! echo "$headers" | grep -qi "^Server:" || { echo "::error::La cabecera Server delata el software"; exit 1; }
          test "$(docker exec app id -u)" != "0" || { echo "::error::La app corre como root"; exit 1; }
          # The sign-in cookie is written by the server, HttpOnly; another site cannot plant one.
          cookie=$(curl -si -X POST -H 'Sec-Fetch-Site: same-origin' -H 'Content-Type: application/json' \
            -d '{"name":"nk_sesion","token":"ci_token_0123456789abcdefghij"}' http://localhost:8080/_nk/sesion)
          echo "$cookie" | grep -qi "^Set-Cookie: __Host-nk_sesion=ci_token_0123456789abcdefghij;.*HttpOnly" \
            || { echo "::error::La cookie de sesión no es HttpOnly"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Sec-Fetch-Site: cross-site' \
            -H 'Content-Type: application/json' -d '{"name":"nk_sesion","token":"x"}' \
            http://localhost:8080/_nk/sesion)" = "403" || { echo "::error::Otra web puede fijar la sesión"; exit 1; }
