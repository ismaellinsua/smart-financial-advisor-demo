# Checks every 10 minutes that each app answers. A failed run means an app is down: GitHub emails the repository
# owner, and OPERATOR_EMAIL gets a message too when SMTP is set up. Set up in README («Errores y caídas»).
name: Disponibilidad

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPTIME_URLS: ${{ secrets.UPTIME_URLS }}
      OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    steps:
      # With the repository variable PRODUCTION = true (Settings → Secrets and variables → Actions → Variables), a
      # missing secret turns the run red: in production la vigilancia de disponibilidad must never be silently off.
      - name: Producción sin configurar
        if: vars.PRODUCTION == 'true' && env.UPTIME_URLS == ''
        run: |
          echo "::error::PRODUCTION=true pero faltan los secretos de la vigilancia de disponibilidad."
          exit 1

      - name: Sin configurar todavía
        if: env.UPTIME_URLS == ''
        run: echo "::notice::Vigilancia desactivada hasta definir el secreto UPTIME_URLS."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: env.UPTIME_URLS != ''

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: env.UPTIME_URLS != ''
        with:
          python-version-file: .python-version

      - name: Comprobar
        if: env.UPTIME_URLS != ''
        run: python ops/uptime.py
